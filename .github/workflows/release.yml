name: Build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - name: Extract pinned CUDA 12.1 toolkit
        run: |
          image=nvidia/cuda@sha256:327c9e046fbf662275be0934742f7e5412f9b24402ee90bf4d649c1a21707912
          container=$(docker create "$image")
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/local/cuda-12.1" "$RUNNER_TEMP/cuda-12.1"
      - name: Build wheel from source archive
        run: python tools/build.py --cuda-root "$RUNNER_TEMP/cuda-12.1"
      - name: Verify release artifacts
        run: |
          python tools/verify.py dist
          uvx --from twine==7.0.0 twine check --strict dist/*.whl dist/*.tar.gz
      - name: Test isolated wheel installation
        run: |
          # Hosted runners have no GPU driver. The toolkit stub permits import-only checks.
          mkdir -p "$RUNNER_TEMP/cuda-stub"
          ln -s "$RUNNER_TEMP/cuda-12.1/targets/x86_64-linux/lib/stubs/libcuda.so" "$RUNNER_TEMP/cuda-stub/libcuda.so.1"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/cuda-stub"
          for version in 3.11 3.12 3.13; do
            uv venv "$RUNNER_TEMP/wheel-test-$version" --python "$version"
            uv pip install --python "$RUNNER_TEMP/wheel-test-$version/bin/python" --only-binary meltygui-pycuda --find-links dist meltygui-pycuda==2026.1.post2
            "$RUNNER_TEMP/wheel-test-$version/bin/python" -I tools/smoke.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/build.json
            dist/auditwheel.txt
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/*.whl dist/*.tar.gz
